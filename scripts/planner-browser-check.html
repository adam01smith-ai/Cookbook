<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner 2.0 browser checks — unpublished</title><style>body{font:16px/1.5 system-ui;background:#f7f4ee;margin:20px}button{padding:12px;font:inherit}iframe{display:block;height:850px;border:1px solid #bbb;background:white;max-width:none;margin:20px 0}pre{white-space:pre-wrap}.pass{color:#245332}.fail{color:#a12620}</style><h1>Planner 2.0 browser regression checks</h1><p>Local review only. Runs the real pages at four frame widths. Uses temporary test plans and restores the previous local storage afterwards. No AI, analytics or contact request is made.</p><button id="run">Run browser checks</button><pre id="results" role="status">Ready.</pre><iframe id="app" title="Planner under test" width="390"></iframe><script>
'use strict';const frame=document.querySelector('#app'),log=document.querySelector('#results'),records=[];let writes=0;
const equal=(a,b,message)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(message);},assert=(value,message)=>{if(!value)throw Error(message);},wait=ms=>new Promise(r=>setTimeout(r,ms));
function load(url){return new Promise((resolve,reject)=>{frame.onload=()=>resolve(frame.contentWindow);frame.onerror=reject;frame.src=url;});}
function change(w,selector,value){const el=w.document.querySelector(selector);assert(el,'Missing '+selector);el.value=value;el.dispatchEvent(new w.Event('change',{bubbles:true}));}
const click=(w,s)=>{const el=w.document.querySelector(s);assert(el,'Missing '+s);el.click();},names=w=>[...w.document.querySelectorAll('#meals .name')].map(e=>e.textContent),storage=()=>localStorage.getItem('my-cookbook-planner-v1');
function check(value,message){assert(value,message);records.push(message);log.textContent=records.join('\n');}
async function run(){if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('Use only the local unpublished preview.');
const keys=['adam-cooks-consent-v1','my-cookbook-planner-v1','adam-cooks-favourites-v1'],backup=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)]));
try{for(const width of [340,390,454,1280]){frame.style.width=width+'px';let w=await load('../meal-planner.html'),P=w.CookbookPlanner;const state=P.initial();state.count=5;state.days[0]={...P.newDay('recipe'),recipeId:'karahi',side:'curry',locked:true,extraPortions:2};state.days[1]={...P.newDay('recipe'),recipeId:'pork-schnitzel',side:'none'};state.days[2]={...P.newDay('leftovers'),source:0};state.days[3]={...P.newDay('out'),title:'Dinner out'};state.gravyChoice='have';state.checked=['retained-check'];
localStorage.setItem('adam-cooks-consent-v1',JSON.stringify({version:2,planner:true,drafts:false,analytics:false,history:false,decided:true,expires:Date.now()+86400000}));localStorage.setItem('my-cookbook-planner-v1',JSON.stringify(state));w=await load('../meal-planner.html?browser-check='+width);const d=w.document;await wait(100);const stored=storage();equal(JSON.parse(stored),state,'Opening changed stored data');const before=names(w),overflow=()=>d.documentElement.scrollWidth>w.innerWidth;
check(!overflow(),width+': planner fits without horizontal overflow');click(w,'#generate');check(!d.querySelector('#variety-preview').hidden,width+': whole-week preview opens');equal(names(w),before,'Week preview changed active meals');click(w,'#discard-variety');equal(storage(),stored,'Discard wrote storage');
change(w,'#swap-intent-1','curry');click(w,'[data-action=swap][data-i="1"]');check(!d.querySelector('#replacement-preview').hidden&&!overflow(),width+': curry replacement preview fits');const suggested=d.querySelector('#replacement-content h4').textContent;equal(names(w),before,'Swap preview changed meals');click(w,'#cancel-replacement');equal(storage(),stored,'Cancel wrote storage');
click(w,'[data-action=swap][data-i="1"]');click(w,'#apply-replacement');const changed=JSON.parse(storage());for(const i of [0,2,3,4,5,6])equal(changed.days[i],state.days[i],'Swap changed another day');check(changed.days[1].recipeId!=='pork-schnitzel',width+': confirmed replacement changes exactly one day');click(w,'#shopping-tab');check(!overflow(),width+': shopping fits');check(!d.querySelector('#shopping-list').textContent.includes('Pork schnitzel'),width+': removed recipe absent from shopping');click(w,'#plain-toggle');check(d.querySelector('#plain-shopping').value.length>0,width+': plain-text shopping works');
click(w,'#week-tab');change(w,'[data-action=rating]','love');click(w,'[data-action=cooked]');const feedback=JSON.parse(storage()).feedback.karahi;check(feedback.rating==='love'&&feedback.cookedOn,width+': rating and cooked date persist');
let printed=0;w.print=()=>printed++;click(w,'#print-menu');check(printed===1,width+': print menu still invokes printing');
// Simulate a downloaded backup imported through the actual file-input handler.
const originalSaved=storage(),exported=JSON.parse(originalSaved),file=new w.File([originalSaved],'planner-test.json',{type:'application/json'}),transfer=new w.DataTransfer();transfer.items.add(file);w.confirm=()=>true;d.querySelector('#backup-file').files=transfer.files;d.querySelector('#backup-file').dispatchEvent(new w.Event('change'));await wait(100);equal(JSON.parse(storage()).feedback,exported.feedback,'Import lost feedback');check(d.querySelector('#status').textContent.includes('imported'),width+': backup import retains cooking memory');
w=await load('../meal-planner.html?restored='+width);check(w.document.querySelector('[data-action=recipe][data-i="0"]').value==='karahi'&&w.document.querySelector('[data-action=rating]').value==='love',width+': reload retains kept meal and rating');
w=await load('../index.html?browser-check='+width);await wait(100);check(!w.document.querySelector('#home-current-week').hidden,width+': homepage restores saved plan');check(w.document.documentElement.scrollWidth<=w.innerWidth,width+': homepage fits');click(w,'#home-different');check(!w.document.querySelector('#home-dinner-result').hidden,width+': something-different entry works');
}}
finally{for(const [k,v]of Object.entries(backup))if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}
log.className='pass';log.textContent=records.join('\n')+'\nPASS: '+records.length+' actual-browser assertions across four widths. Test storage restored.';document.querySelector('#run').disabled=false;}
document.querySelector('#run').onclick=()=>{records.length=0;document.querySelector('#run').disabled=true;run().catch(e=>{log.className='fail';log.textContent+='\nFAIL: '+e.message;document.querySelector('#run').disabled=false;});};
</script></html>
