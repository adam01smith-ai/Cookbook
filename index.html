<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f7f5ee">
<title>My Cookbook — Something good starts here</title>
<style>
:root{--bg:#f7f5ee;--paper:#fffef9;--ink:#233c32;--muted:#737b70;--line:#dddfd2;--accent:#b7462d;--soft:#eceee2;--shadow:0 8px 25px #233c3207}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--bg:#19251f;--paper:#223229;--ink:#f1f1df;--muted:#afb8ab;--line:#3e4c40;--accent:#f39979;--soft:#2e4034;--shadow:none}button,input,a{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}header{border-bottom:1px solid var(--line)}.topbar{max-width:1180px;margin:auto;padding:22px 32px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:23px;font-weight:bold;letter-spacing:-.6px;display:flex;align-items:center;gap:11px}.brand svg{width:28px;height:28px}.theme{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:50%;width:42px;height:42px;font-size:20px}.edition{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-left:auto;margin-right:28px}main{max-width:1180px;margin:auto;padding:0 32px}.hero{padding:55px 0 40px;display:grid;grid-template-columns:1fr 250px;gap:32px;align-items:center}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:750;margin:0 0 17px}h1{font:normal clamp(40px,5.5vw,67px)/1.05 Georgia,serif;letter-spacing:-2.6px;margin:0 0 20px}h1 em{color:var(--accent);font-weight:normal}.intro{color:var(--muted);max-width:450px;margin:0;font-size:16px}.illustration{width:230px;height:210px;justify-self:end;color:var(--ink)}.tools{margin-top:28px;display:flex;gap:12px;margin-bottom:22px}.search{position:relative;flex:1}.search svg{position:absolute;left:18px;top:17px;width:20px;height:20px;color:var(--muted)}input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px 49px;color:var(--ink);font:inherit}input::placeholder{color:var(--muted)}.favourites{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px 20px;border-radius:12px;white-space:nowrap}.favourites[aria-pressed=true]{background:var(--ink);color:var(--bg)}.filters{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}.filter{border:1px solid transparent;color:var(--muted);background:transparent;padding:8px 15px;border-radius:24px;font-size:13px}.filter:hover{background:var(--soft)}.filter[aria-pressed=true]{background:var(--ink);color:var(--bg)}.results-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:27px 0 20px}.results-head h2{font:normal 28px Georgia,serif;margin:0;letter-spacing:-.6px}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);transition:transform .18s,border-color .18s;overflow:hidden}.card:hover{transform:translateY(-3px);border-color:var(--muted)}.recipe{display:block;padding:24px;text-decoration:none;color:inherit;height:100%}.icon{font-size:29px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--soft);margin-bottom:23px}.category{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}.recipe h3{font:normal 23px/1.2 Georgia,serif;margin:7px 0 23px;letter-spacing:-.4px}.open{font-size:12px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}.open span{font-size:19px}.save{position:absolute;right:16px;top:16px;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;background:var(--paper);color:var(--muted);font-size:20px;z-index:1}.save[aria-pressed=true]{color:var(--accent);background:var(--soft)}.empty{text-align:center;padding:65px 20px;border:1px dashed var(--line);border-radius:14px}.empty h3{font:normal 26px Georgia,serif;margin:0 0 10px}.empty p{color:var(--muted)}.reset{border:0;border-radius:8px;background:var(--ink);color:var(--bg);padding:10px 18px}footer{padding:32px 0;margin-top:40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.notice{color:var(--muted);font-size:12px;max-width:650px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}[hidden]{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr 170px}.illustration{width:170px}.edition{display:none}}@media(max-width:540px){main{padding:0 20px}.topbar{padding:18px 20px}.hero{padding:36px 0 28px;display:block}.illustration{display:none}h1{font-size:47px;letter-spacing:-2px}.tools{flex-wrap:wrap}.search{flex-basis:100%}.favourites{padding:9px 14px;font-size:13px}.filters{gap:3px;padding-bottom:20px}.filter{padding:8px 11px}.grid{gap:10px}.recipe{padding:18px 14px}.recipe h3{font-size:20px;min-height:48px}.icon{width:50px;height:50px;font-size:25px}.save{right:10px;top:10px}.results-head h2{font-size:25px}footer{gap:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="topbar"><div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M16 8C12 5 6 5 3 6v20c4-1 9-1 13 2 4-3 9-3 13-2V6c-3-1-9-1-13 2v20M7 11l5 1m-5 4 5 1m8-5 5-1m-5 6 5-1"/></svg>My Cookbook<span style="color:var(--accent)">.</span></div><span class="edition">Collected, cooked & loved</span><button class="theme" id="theme" aria-label="Switch to dark mode" title="Switch theme">☾</button></div></header>
<main>

<div class="tools"><div class="search"><label class="sr-only" for="search">Search recipes by name or category</label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="What do you fancy cooking?" autocomplete="off"></div><button class="favourites" id="favourites" aria-pressed="false">♡ Favourites <span id="saved-count">0</span></button></div>
<nav class="filters" id="filters" aria-label="Filter by recipe category"></nav>
<div class="results-head"><h2 id="result-title">All recipes</h2><span class="count" id="count" role="status" aria-live="polite"></span></div>
<div class="grid" id="recipes"></div><div class="empty" id="empty" hidden><h3 id="empty-title">Nothing simmering here yet.</h3><p id="empty-text">Try another search or choose a different category.</p><button class="reset" id="reset">Show all recipes</button></div>
<noscript><p>Please enable JavaScript to search and browse this recipe collection.</p></noscript>
<p class="notice" id="storage-notice" hidden>Preferences can’t be saved in this browser. They’ll work for this visit.</p>
<footer><span>Made for the joy of cooking.</span><span>My Cookbook · <span id="total"></span> recipes</span></footer>
</main>
<script>
'use strict';
const groups=[["Rice & Bowls","🍚",[["Korean Style Gochujang Beef and Pork Bibimbap","korean-style-gochujang-beef-pork-bibimbap.html","🍚"],["Indonesian Chicken Poke Bowl","indonesian-chicken-poke-bowl.html","🍚"],["Moroccan Meatballs","moroccan-meatball-bowl.html","🍲"]]],["Pasta","🍝",[["Truffle Pasta","truffle pasta.html","🍄"],["Harissa Prawn Orzo","harissa-prawn-orzo.html","🌶️"],["Creamy Pastina","pastina.html","🍲"],["Baked Ziti","baked-ziti.html","🧀"],["Carbonara","carbonara.html"],["Mediterranean Pasta Salad","mediterranean-pasta-salad.html"],["Pesto Pasta Salad","pesto-pasta-salad.html","🌿"]]],["Curries","🍛",[["Jalfrezi","jalfrezi.html"],["Pathia","pathia.html"],["Base Gravy","basegravy.html","🍲"]]],["Slow Cooker","🥘",[["Slow Cooker Beef Rendang","slow-cooker-beef-rendang.html","🍛"]]],["Noodles","🍜",[["Satay Beef Noodles","satay-beef-noodles.html","🥜"],["Ginger and Lime Chicken Noodle Soup","ginger-lime-chicken-noodle-soup.html","🍜"]]],["Soups","🥣",[["Coconutty Caribbean Soup","coconutty-caribbean-soup.html","🥥"],["Minestrone","minestrone.html","🍲"],["Pea & Asparagus Soup","pea-asparagus-soup.html"],["Carrot Soup","carrot-coriander-soup.html","🥕"],["Broccoli Stilton","broccoli-stilton-soup.html","🥦"],["Red Pepper Soup","roasted-red-pepper-soup.html","🌶️"]]],["Sauces","🥄",[["Sofritto Ragu","sofritto-ragu.html","🍅"],["Vinaigrette","vinaigrette.html"],["BBQ Sauce","jack-daniels-sauce.html"],["Panda Express Orange Chicken Sauce","panda-express-orange-chicken-sauce.html","🍊"]]],["Fresh","🥗",[["Lemon Chicken Salad","lemon-chicken-salad.html"],["Acai Bowl","acai-bowl.html","🫐"]]],["Comfort","🍗",[["Cottage Pie","cottage-pie.html","🥔"],["Creamy Garlic Chicken","creamy-garlic-chicken.html"]]],["Bakes","🥧",[["Broccoli Quiche","broccoli-quiche.html","🥦"]]],["Desserts","🍰",[["Lemon Cheesecake","lemon-cheesecake.html","🍋"],["Chocolate Chip Cookies","chocolate-chip-cookies.html","🍪"],["Caramel Fudge","caramel-fudge.html","🍬"],["Carrot Cake","carrot-cake.html","🥕"],["Crème Brûlée","creme-brulee.html","🍮"]]]];
const recipes=groups.flatMap(([category,icon,items])=>items.map(([name,url,emoji])=>({name,url,category,icon:emoji||icon})));
const $=id=>document.getElementById(id);let category='All',onlySaved=false;const normalise=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{$('storage-notice').hidden=false}}
const stored=read('cookbook-favourites',[]);const saved=new Set(Array.isArray(stored)?stored.filter(u=>recipes.some(r=>r.url===u)):[]);
function setTheme(dark){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀':'☾';$('theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')}
const preference=read('cookbook-theme',null);setTheme(preference==='dark'||(preference===null&&window.matchMedia('(prefers-color-scheme: dark)').matches));$('theme').onclick=()=>{const dark=!document.body.classList.contains('dark');setTheme(dark);write('cookbook-theme',dark?'dark':'light')};
for(const name of ['All',...groups.map(g=>g[0])]){const button=document.createElement('button');button.className='filter';button.textContent=name;button.setAttribute('aria-pressed',String(name===category));button.onclick=()=>{category=name;render()};$('filters').append(button)}
const cards=recipes.map(r=>{const card=document.createElement('article');card.className='card';const link=document.createElement('a');link.className='recipe';link.setAttribute('href',r.url);const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=r.icon;const label=document.createElement('span');label.className='category';label.textContent=r.category;const name=document.createElement('h3');name.textContent=r.name;const open=document.createElement('div');open.className='open';open.innerHTML='View recipe <span aria-hidden="true">↗</span>';link.append(icon,label,name,open);const save=document.createElement('button');save.className='save';save.onclick=()=>{saved.has(r.url)?saved.delete(r.url):saved.add(r.url);write('cookbook-favourites',[...saved]);render()};card.append(link,save);$('recipes').append(card);return{card,save,r}});
function render(){const query=normalise($('search').value.trim());let count=0;cards.forEach(({card,save,r})=>{const isSaved=saved.has(r.url);card.hidden=!((category==='All'||r.category===category)&&(!onlySaved||isSaved)&&normalise(r.name+' '+r.category).includes(query));if(!card.hidden)count++;save.textContent=isSaved?'♥':'♡';save.setAttribute('aria-pressed',String(isSaved));save.setAttribute('aria-label',(isSaved?'Remove ':'Save ')+r.name+(isSaved?' from favourites':' to favourites'))});$('filters').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===category)));$('favourites').setAttribute('aria-pressed',String(onlySaved));$('saved-count').textContent=saved.size;$('result-title').textContent=onlySaved?(category==='All'?'Your favourites':category+' favourites'):(category==='All'?'All recipes':category);$('count').textContent=count+' recipe'+(count===1?'':'s')+(query?' found':'');$('empty').hidden=count!==0;$('empty-title').textContent=onlySaved&&saved.size===0?'Your favourites start here.':'No recipes found.';$('empty-text').textContent=onlySaved&&saved.size===0?'Tap the heart on any recipe to keep it close.':'Try another search or choose a different category.'}
$('search').addEventListener('input',render);$('favourites').onclick=()=>{onlySaved=!onlySaved;render()};$('reset').onclick=()=>{category='All';onlySaved=false;$('search').value='';render()};$('total').textContent=recipes.length;render();
</script>
</body>
</html>
